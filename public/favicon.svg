<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo escuro moderno -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Gradiente roxo Twitch característico -->
    <linearGradient id="twitchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9146ff" />
      <stop offset="100%" stop-color="#772ce8" />
    </linearGradient>

    <!-- Gradiente do peão -->
    <linearGradient id="pieceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d0d7de" />
    </linearGradient>

    <!-- Filtro de brilho sutil -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#9146ff" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fundo Squircle com borda Twitch estilizada -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="112"
    fill="url(#bgGrad)"
    stroke="url(#twitchGrad)"
    stroke-width="24"
  />

  <!-- Indicador dinâmico de transmissão Live (Ponto de pulso neon verde) -->
  <circle cx="360" cy="130" r="28" fill="#3fb950" />
  <circle cx="360" cy="130" r="44" fill="none" stroke="#3fb950" stroke-width="8" stroke-dasharray="12 8" opacity="0.8" />

  <!-- Peão de Xadrez Estilizado e Moderno (En Passant) -->
  <g filter="url(#glow)">
    <!-- Cabeça do Peão -->
    <circle cx="236" cy="164" r="58" fill="url(#pieceGrad)" />
    
    <!-- Colar / Anel superior -->
    <rect x="186" y="222" width="100" height="20" rx="10" fill="url(#pieceGrad)" />

    <!-- Corpo curvo do Peão com corte angular dinâmico -->
    <path
      d="M204 246 C204 286 166 350 156 384 L316 384 C306 350 268 286 268 246 Z"
      fill="url(#pieceGrad)"
    />

    <!-- Base do Peão -->
    <path
      d="M136 394 C136 388 142 384 148 384 L324 384 C330 384 336 388 336 394 L346 430 C346 436 340 440 334 440 L138 440 C132 440 126 436 126 430 Z"
      fill="url(#pieceGrad)"
    />
  </g>
</svg>
