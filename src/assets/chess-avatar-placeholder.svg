<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Fundo com gradiente suave integrado ao tema escuro -->
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="pieceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b949e" />
      <stop offset="100%" stop-color="#6e7681" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="50" fill="url(#avatarBg)" stroke="#30363d" stroke-width="2" />

  <!-- Silhueta estilizada de Cavalo de Xadrez (Knight) -->
  <g fill="url(#pieceGrad)" stroke="#30363d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Base da peça -->
    <path d="M28 80h44c0-4-3-7-8-7H36c-5 0-8 3-8 7z" />
    <path d="M33 73h34c0-3-2-5-5-5H38c-3 0-5 2-5 5z" />

    <!-- Corpo, pescoço e cabeça do Cavalo -->
    <path d="M36 68c2-8 3-14 3-18 0-4-2-8-5-10-3-2-5-6-4-10 1-4 4-7 8-8 3-1 7 0 9 2 2-3 5-5 9-5 6 0 11 4 12 10 1 5 0 9-3 12 5 2 8 7 8 13 0 4-1 9-3 14H36z" />
    
    <!-- Focinho / Narina e detalhes -->
    <path d="M31 34c1 2 3 3 5 3" fill="none" stroke="#21262d" stroke-width="2" />
    <!-- Olho -->
    <circle cx="43" cy="27" r="2.5" fill="#21262d" stroke="none" />
    <!-- Crina / Detalhe posterior -->
    <path d="M60 26c3 3 5 7 5 12" fill="none" stroke="#30363d" stroke-width="2" />
  </g>
</svg>
